spring.application.name=library-api


server.port=8083
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:35432/library_db}
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:library123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Swagger
# http://localhost:8083/docs

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.path=/swagger-ui.html
